[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpthreejs"
version = "0.2.0"
description = "Code-first image-to-Three.js pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gpthreejs contributors" }]
dependencies = []

[project.optional-dependencies]
cpu = []
dev = []

[project.scripts]
gpthreejs = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["cast/surface/presets.json", "extras/*.txt"]
